spring:
  config:
    import:
      - "optional:file:.env[.properties]"
      - "optional:file:../.env[.properties]"

  application:
    name: mangablade-backend

  flyway:
    baseline-on-migrate: true

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/MangaBlade?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  app:
    otruyen:
      manga-import-cron: "0 */30 * * * *"
      importer:
        max-manga-per-run: 2
    cloudinary:
      chapter-page-sync-cron: "30 */10 * * * *"
      importer:
        max-chapters-per-run: 20
  elasticsearch:
    uris: ${ELASTICSEARCH_URL:http://localhost:9200}

jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration-ms: 3600000

google:
  client-id: ${GOOGLE_CLIENT_ID}

turnstile:
  secret: ${TURNSTILE_SECRET:}

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

r2:
  endpoint: ${R2_ENDPOINT:http://localhost:9000}
  access-key: ${R2_ACCESS_KEY:test}
  secret-key: ${R2_SECRET_KEY:test}
  bucket: ${R2_BUCKET:mangablade-forum}
  public-url: ${R2_PUBLIC_URL:http://localhost:9000/mangablade-forum}

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "[%d{yyyy-MM-dd HH:mm:ss}] %clr(%-5level) %blue(%-40.40logger{39}) : %msg%n"
    file: "[%d{yyyy-MM-dd HH:mm:ss}] %-5level %-40.40logger{39} : %msg%n"
  level:
    com.mangablade.backend: debug
    root: info

server:
  address: 0.0.0.0
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
